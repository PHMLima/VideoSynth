<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix Remix: Sintetizador Audiovisual Modular</title>
    <meta name="description" content="Um sintetizador musical generativo interativo que transforma vídeos em sons e música em tempo real através de sensores coloridos e estimulação de movimento." />
    <meta property="og:title" content="Remix Remix: Sintetizador Audiovisual Modular" />
    <meta property="og:description" content="Um sintetizador musical generativo interativo que transforma vídeos em sons e música em tempo real através de sensores coloridos e estimulação de movimento." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      window.__loadStandaloneBundle = function () {
        if (window.__STANDALONE_LOADING__ || window.__APP_MOUNTED__) return;
        window.__STANDALONE_LOADING__ = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './standalone/app.css';
        document.head.appendChild(link);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = './standalone/app.js';
        document.body.appendChild(script);
      };
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!window.__APP_MOUNTED__) {
            window.__loadStandaloneBundle();
          }
        }, 700);
      });
    </script>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx" onerror="window.__loadStandaloneBundle && window.__loadStandaloneBundle()"></script>
  </body>
</html>
